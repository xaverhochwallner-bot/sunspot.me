[build]
  base    = "sunspot"
  publish = "build/web"
  command = """
    git clone https://github.com/flutter/flutter.git --branch stable --depth 1 $HOME/flutter
    export PATH=$HOME/flutter/bin:$PATH
    flutter pub get
    flutter build web --release
  """

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
