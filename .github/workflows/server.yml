name: Server CI

on:
  push:
    branches: [dev, master]
    paths:
      - 'sunspot_server/**'
      - '.github/workflows/server.yml'
  pull_request:
    branches: [dev, master]
    paths:
      - 'sunspot_server/**'
      - '.github/workflows/server.yml'

jobs:
  lint:
    name: Lint and syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sunspot_server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: sunspot_server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff lint (errors only)
        run: ruff check --select E,F --ignore E501,E402,E701,E702,E401 .

      - name: Syntax check
        run: python -m compileall -q .
